<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Game Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e1e2f, #2b2b45);
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin-top: 40px;
        }

        .menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 40px;
            gap: 20px;
        }

        .game-card {
            background: #3a3a5a;
            padding: 20px;
            border-radius: 12px;
            width: 200px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .game-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .game-card a {
            text-decoration: none;
            color: white;
            display: block;
        }

        .game-title {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .play-btn {
            background: #ff7a18;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }

        .play-btn:hover {
            background: #ff9a3c;
        }
    </style>
</head>
<body>

    <h1>Ejercicios de Computacion</h1>

    <div class="menu">

        <div class="game-card">
            <a href="type.html">
                <div class="game-title">Escribiendo en el Teclado</div>
                <button class="play-btn">Empezar</button>
            </a>
        </div>

        <div class="game-card">
            <a href="selection.html">
                <div class="game-title">Selección de Texto</div>
                <button class="play-btn">Empezar</button>
            </a>
        </div>

    </div>

</body>
</html>
